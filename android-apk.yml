name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'source.zip'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android build components
        run: sdkmanager "platforms;android-33" "build-tools;33.0.1" "ndk;25.2.9519653" "cmake;3.22.1"
      - name: Extract source
        run: mkdir source && unzip -q source.zip -d source
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle -p source/android --no-daemon assembleDebug
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metin2-debug-apk
          path: source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
